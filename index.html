<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" />
    <meta name="description" content="Korte, praktiske moduler for å forstå HICO." />
    <title>HICO · Spørsmål for spørsmål</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="course-data.js" defer></script>
    <script src="quiz-data.js" defer></script>
    <script src="simple-app.js" defer></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="#modules" aria-label="HICO, velg modul">
          <span class="brand-mark" aria-hidden="true">?</span>
          <span>HICO</span>
        </a>
      </header>

      <main>
        <section class="screen module-screen" id="module-screen">
          <div class="home-heading">
            <h1>Velg modul</h1>
          </div>
          <div class="module-heading"><span id="module-count">0 / 3</span></div>
          <div class="module-grid" id="module-grid" aria-label="HICO-moduler"></div>
        </section>

        <section class="screen question-screen" id="question-screen" hidden>
          <button class="back-link" id="question-back-to-modules" type="button"><span aria-hidden="true">←</span> Moduler</button>
          <div class="question-meta"><span id="question-position">SPØRSMÅL 1 / 6</span><span id="question-score">0 riktige</span></div>
          <div class="progress-track question-progress" aria-label="Framdrift"><i id="question-progress-fill"></i></div>
          <p class="eyebrow question-type" id="question-type">GRUNNLEGGENDE</p>
          <h1 class="question-title" id="question-title"></h1>
          <p class="question-concepts" id="question-concepts"></p>
          <div class="answer-list" id="answer-list" role="group" aria-labelledby="question-title"></div>
          <div class="answer-context" id="answer-context" hidden aria-live="polite"><span class="context-icon" id="context-icon"></span><div><strong id="context-title">HVORFOR?</strong><p id="context-copy"></p></div></div>
          <div class="question-actions"><button class="secondary-button" id="previous-question" type="button"><span aria-hidden="true">←</span> Forrige</button><span class="save-note">Svar lagres på denne enheten</span><button class="primary-button" id="next-question" type="button" disabled>Neste <span aria-hidden="true">→</span></button></div>
        </section>

        <section class="screen result-screen" id="result-screen" hidden>
          <button class="back-link" id="result-back" type="button"><span aria-hidden="true">←</span> Modulene</button>
          <p class="eyebrow">MODUL FERDIG</p>
          <h1 id="result-title">Godt jobbet.</h1>
          <p class="lead" id="result-copy"></p>
          <div class="result-score"><strong id="result-score">0 / 0</strong><span>riktige svar</span></div>
          <div class="takeaway"><p class="eyebrow">HUSK</p><p id="result-takeaway"></p></div>
          <div class="result-actions"><button class="secondary-button" id="retry-module" type="button">Ta modulen på nytt</button><button class="primary-button" id="continue-module" type="button">Neste modul <span aria-hidden="true">→</span></button></div>
        </section>
      </main>

      <footer class="site-footer"><span>Ikke passiv læring – men aktiv</span><span>Made by Terje</span></footer>
    </div>
  </body>
</html>
